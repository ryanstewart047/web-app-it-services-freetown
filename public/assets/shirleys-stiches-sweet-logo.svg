<svg width="640" height="220" viewBox="0 0 640 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sl-title sl-desc">
  <title id="sl-title">Shirley's Stitches &amp; Sweet</title>
  <desc id="sl-desc">Rose gold circular logo with a cupcake, sewing needle and thread, and floral swirls for Shirley's Stitches &amp; Sweet — Bakery, Pastries &amp; Fashion in Freetown, Sierra Leone.</desc>

  <!-- Background -->
  <rect width="640" height="220" rx="28" fill="#fffdf8"/>

  <!-- ── Circular badge ── -->
  <circle cx="110" cy="110" r="100" fill="#fffdf8" stroke="#c9956c" stroke-width="2.5"/>
  <circle cx="110" cy="110" r="94" fill="#fffdf8" stroke="#d4af6a" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Floral vine left -->
  <path d="M30 110 Q38 80 55 70 Q45 90 60 100 Q40 95 30 110Z" fill="#f0c9b0" opacity="0.7"/>
  <path d="M28 115 Q22 95 35 78 Q30 98 44 108Z" fill="#e8b9a0" opacity="0.5"/>
  <ellipse cx="36" cy="72" rx="7" ry="10" fill="#f7c5c5" transform="rotate(-30 36 72)"/>
  <ellipse cx="24" cy="90" rx="5" ry="8" fill="#f0c0c0" transform="rotate(20 24 90)"/>

  <!-- Floral vine right -->
  <path d="M190 110 Q182 80 165 70 Q175 90 160 100 Q180 95 190 110Z" fill="#f0c9b0" opacity="0.7"/>
  <path d="M192 115 Q198 95 185 78 Q190 98 176 108Z" fill="#e8b9a0" opacity="0.5"/>
  <ellipse cx="184" cy="72" rx="7" ry="10" fill="#f7c5c5" transform="rotate(30 184 72)"/>
  <ellipse cx="196" cy="90" rx="5" ry="8" fill="#f0c0c0" transform="rotate(-20 196 90)"/>

  <!-- ── Cupcake body ── -->
  <!-- Cup liner -->
  <path d="M76 132 Q110 138 144 132 L136 168 Q110 172 84 168 Z" fill="#c9956c"/>
  <!-- Liner ridges -->
  <line x1="91" y1="135" x2="87" y2="167" stroke="#b07040" stroke-width="1.5" opacity="0.6"/>
  <line x1="101" y1="136" x2="99" y2="169" stroke="#b07040" stroke-width="1.5" opacity="0.6"/>
  <line x1="110" y1="137" x2="110" y2="169" stroke="#b07040" stroke-width="1.5" opacity="0.6"/>
  <line x1="119" y1="136" x2="121" y2="169" stroke="#b07040" stroke-width="1.5" opacity="0.6"/>
  <line x1="129" y1="135" x2="133" y2="167" stroke="#b07040" stroke-width="1.5" opacity="0.6"/>
  <!-- Frosting base -->
  <path d="M72 135 Q85 115 110 110 Q135 115 148 135 Q130 132 110 133 Q90 132 72 135Z" fill="#fef5f0"/>
  <!-- Frosting swirl layers -->
  <path d="M82 132 Q90 108 110 103 Q130 108 138 132" fill="#fef0ea" stroke="#f0d0c0" stroke-width="0.5"/>
  <path d="M90 120 Q98 100 110 97 Q122 100 130 120" fill="#fdeee5" stroke="#e8c8b5" stroke-width="0.5"/>
  <path d="M98 112 Q104 95 110 92 Q116 95 122 112" fill="#fce8dc"/>
  <!-- Frosting tip -->
  <ellipse cx="110" cy="90" rx="12" ry="10" fill="#fce0d0"/>
  <ellipse cx="110" cy="85" rx="7" ry="7" fill="#f9d5c5"/>
  <!-- Pink rose on top -->
  <circle cx="110" cy="78" r="12" fill="#f7c5c5"/>
  <path d="M104 78 Q107 70 110 75 Q113 70 116 78 Q113 85 110 82 Q107 85 104 78Z" fill="#e8a0a8"/>
  <path d="M102 82 Q106 75 110 79 Q114 75 118 82" stroke="#d4889a" stroke-width="1" fill="none"/>
  <ellipse cx="104" cy="84" rx="5" ry="4" fill="#f0b5bd" transform="rotate(-15 104 84)"/>
  <ellipse cx="116" cy="84" rx="5" ry="4" fill="#f0b5bd" transform="rotate(15 116 84)"/>
  <!-- Rose leaves -->
  <path d="M99 75 Q93 68 96 62 Q103 68 99 75Z" fill="#90c090"/>
  <path d="M121 75 Q127 68 124 62 Q117 68 121 75Z" fill="#90c090"/>

  <!-- ── Sewing needle ── -->
  <line x1="130" y1="65" x2="75" y2="155" stroke="#d4af6a" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="132" cy="62" rx="5" ry="8" fill="#c9956c" transform="rotate(-55 132 62)"/>
  <ellipse cx="134" cy="59" rx="2.5" ry="4" fill="#d4af6a" transform="rotate(-55 134 59)"/>
  <!-- Needle eye hole -->
  <ellipse cx="132" cy="61" rx="1.5" ry="2.5" fill="#fffdf8" transform="rotate(-55 132 61)"/>
  <!-- Thread -->
  <path d="M131 63 Q155 50 170 70 Q160 90 140 80 Q120 75 110 90" stroke="#c9956c" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M75 155 Q60 170 50 158 Q55 148 68 152" stroke="#c9956c" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Small gold dots accent -->
  <circle cx="60" cy="110" r="2" fill="#d4af6a" opacity="0.5"/>
  <circle cx="160" cy="110" r="2" fill="#d4af6a" opacity="0.5"/>
  <circle cx="55" cy="125" r="1.5" fill="#c9956c" opacity="0.4"/>
  <circle cx="165" cy="125" r="1.5" fill="#c9956c" opacity="0.4"/>

  <!-- ── Text inside badge ── -->
  <!-- "Shirley's" arc text approximated as centered top -->
  <text x="110" y="55" text-anchor="middle" fill="#c9956c" font-family="Georgia, 'Palatino Linotype', serif" font-size="22" font-weight="700" font-style="italic" letter-spacing="1">Shirley's</text>
  <!-- Bottom tagline -->
  <text x="110" y="185" text-anchor="middle" fill="#d4af6a" font-family="Georgia, 'Palatino Linotype', serif" font-size="13" font-weight="700" letter-spacing="2">STITCHES &amp; SWEET</text>

  <!-- ── Right side brand text ── -->
  <!-- Divider line -->
  <line x1="225" y1="55" x2="225" y2="165" stroke="#d4af6a" stroke-width="1" opacity="0.5"/>

  <!-- Large script name -->
  <text x="245" y="100" fill="#c9956c" font-family="Georgia, 'Palatino Linotype', serif" font-size="52" font-weight="700" font-style="italic" letter-spacing="-1">Shirley's</text>
  <!-- Divider -->
  <line x1="245" y1="110" x2="625" y2="110" stroke="#d4af6a" stroke-width="1" opacity="0.4"/>
  <!-- Sub name -->
  <text x="247" y="140" fill="#4d3039" font-family="Georgia, 'Palatino Linotype', serif" font-size="28" font-weight="800" letter-spacing="3">STITCHES &amp; SWEET</text>
  <!-- Tagline -->
  <text x="249" y="168" fill="#9b6e78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" letter-spacing="1">Bakery · Pastries · Custom Fashion · Freetown, SL</text>

  <!-- Decorative rose gold dots row -->
  <circle cx="248" cy="178" r="2" fill="#d4af6a" opacity="0.6"/>
  <circle cx="258" cy="178" r="1.5" fill="#c9956c" opacity="0.5"/>
  <circle cx="266" cy="178" r="2" fill="#d4af6a" opacity="0.6"/>
</svg>
